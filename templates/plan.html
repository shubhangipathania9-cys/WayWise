{% extends "base.html" %} {% block title %}WayWise | Plan Your Trip{% endblock
%} {% block content %}
<section class="planning-page">
  <div class="planning-header">
    <h1>Plan Your Journey</h1>
    <p>
      Tell us about your trip, and we'll build a journey around your budget and
      travel style.
    </p>
  </div>
  {% if error %}
  <p class="form-error">{{ error }}</p>
  {% endif %}

  <form
    class="planning-form"
    method="POST"
    action="{{ url_for('preferences') }}"
  >
    <div class="form-group">
      <label for="destination">Where do you want to go?</label>
      <input
        type="text"
        id="destination"
        name="destination"
        placeholder="e.g. Manali"
        required
        minlength="2"
        maxlength="60"
        oninvalid="
          this.setCustomValidity('Please enter your destination name.')
        "
        oninput="this.setCustomValidity('')"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="days">How many days?</label>
        <input
          type="number"
          id="days"
          name="days"
          min="1"
          max="30"
          step="1"
          placeholder="e.g. 5"
          required
        />
      </div>

      <div class="form-group">
        <label for="travellers">How many travellers?</label>
        <input
          type="number"
          id="travellers"
          name="travellers"
          min="1"
          max="20"
          step="1"
          placeholder="e.g. 2"
          required
        />
      </div>
    </div>

    <div class="form-group">
      <label for="budget">What's your total budget?</label>
      <input
        type="number"
        id="budget"
        name="budget"
        min="1"
        step="1"
        placeholder="₹ 25,000"
        required
        oninvalid="
          this.setCustomValidity('Please enter your total trip budget.')
        "
        oninput="this.setCustomValidity('')"
      />
    </div>

    <button type="submit" class="hero-btn">Continue</button>
  </form>
</section>

{% endblock %}
