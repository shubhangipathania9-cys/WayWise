<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171a20" />

    <title>{% block title %}WayWise | Travel Smarter{% endblock %}</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}" aria-label="WayWise home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path
                d="M8 29L15 10L21 25L27 15L32 29"
                stroke="currentColor"
                stroke-width="3.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="28" cy="10" r="3" fill="#9BC9E3" />
            </svg>
          </span>
          <span>WAYWISE<span class="brand-period">.</span></span>
        </a>

        <div class="nav-links">
          <a href="{{ url_for('home') }}#destinations">Discover</a>
          <a href="{{ url_for('home') }}#hidden-gems">Hidden gems</a>
          <a href="{{ url_for('home') }}#how-it-works">How it works</a>
        </div>

        <div class="nav-actions">
          <button
            type="button"
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Switch colour theme"
            title="Switch colour theme"
          >
            <svg class="theme-sun" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="4"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <svg class="theme-moon" viewBox="0 0 24 24" fill="none">
              <path
                d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <a class="nav-cta" href="{{ url_for('plan') }}">
            Plan a trip <span aria-hidden="true">↗</span>
          </a>
        </div>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <a class="footer-brand" href="{{ url_for('home') }}">WAYWISE.</a>
      <p>Plan within your budget. Discover beyond the ordinary.</p>
      <span>Made for curious travellers.</span>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
